apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture-crash-loop
  namespace: sre-fixture-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fixture-crash-loop
  template:
    metadata:
      labels:
        app: fixture-crash-loop
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "exit 1"]
