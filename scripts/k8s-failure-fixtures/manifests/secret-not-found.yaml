apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture-secret-not-found
  namespace: sre-fixture-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fixture-secret-not-found
  template:
    metadata:
      labels:
        app: fixture-secret-not-found
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          envFrom:
            - secretRef:
                name: fixture-absent-secret
