apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture-failed-scheduling
  namespace: sre-fixture-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fixture-failed-scheduling
  template:
    metadata:
      labels:
        app: fixture-failed-scheduling
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: "999"
              memory: 999Gi
