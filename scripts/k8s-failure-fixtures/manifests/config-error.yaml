apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture-config-error
  namespace: sre-fixture-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fixture-config-error
  template:
    metadata:
      labels:
        app: fixture-config-error
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          env:
            - name: MISSING_SECRET
              valueFrom:
                secretKeyRef:
                  name: fixture-missing-secret
                  key: token
