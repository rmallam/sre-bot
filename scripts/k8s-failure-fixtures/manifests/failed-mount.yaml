apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fixture-missing-pvc
  namespace: sre-fixture-lab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture-failed-mount
  namespace: sre-fixture-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fixture-failed-mount
  template:
    metadata:
      labels:
        app: fixture-failed-mount
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fixture-nonexistent-pvc
