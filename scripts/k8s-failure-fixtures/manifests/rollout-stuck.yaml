apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture-rollout-stuck
  namespace: sre-fixture-lab
spec:
  replicas: 2
  progressDeadlineSeconds: 60
  selector:
    matchLabels:
      app: fixture-rollout-stuck
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: fixture-rollout-stuck
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "exit 1"]
