apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture-init-container-error
  namespace: sre-fixture-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fixture-init-container-error
  template:
    metadata:
      labels:
        app: fixture-init-container-error
    spec:
      initContainers:
        - name: init
          image: busybox:1.36
          command: ["sh", "-c", "exit 1"]
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
