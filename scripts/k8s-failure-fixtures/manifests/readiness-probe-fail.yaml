apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture-readiness-probe-fail
  namespace: sre-fixture-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fixture-readiness-probe-fail
  template:
    metadata:
      labels:
        app: fixture-readiness-probe-fail
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
