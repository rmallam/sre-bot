# Example local overrides — copy to my-values.yaml (do not commit secrets)

global:
  imageOwner: rmallam
  imageTag: main
  imagePullSecrets: []
  # - name: ghcr-credentials

llm:
  provider: openrouter
  openrouter:
    brainModel: anthropic/claude-sonnet-4
    commanderModel: google/gemini-2.5-flash

secrets:
  create: true
  openrouterApiKey: "YOUR_OPENROUTER_KEY"
  geminiApiKey: ""
  openaiApiKey: ""
  gitopsRepoUrl: "git@github.com:your-org/your-gitops-repo.git"
  githubToken: "ghp_xxx"
  deployAppRepoWriteToken: ""
  githubWebhookSecret: ""
  allowedUsers: "123456789"
  telegramBotToken: "your-telegram-bot-token"
  telegramAlertChatId: "-100xxxxxxxx"
  slackBotToken: ""
  slackAppToken: ""
  slackSigningSecret: ""
  gitSshPrivateKey: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    ...
    -----END OPENSSH PRIVATE KEY-----

postgres:
  auth:
    password: "change-me-in-production"

ragPostgres:
  auth:
    password: "change-me-in-production"

investigator:
  lokiUrl: ""
  prometheusUrl: ""

orchestrator:
  registryDryRun: "true"

ingress:
  hil:
    enabled: false
    host: hil.your-domain.example
  console:
    enabled: false
    host: console.your-domain.example
