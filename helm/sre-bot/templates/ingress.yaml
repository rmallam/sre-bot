{{- if .Values.ingress.hil.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hil-dashboard
  namespace: {{ include "sre-bot.namespace" . }}
  labels:
    {{- include "sre-bot.labels" . | nindent 4 }}
  {{- with .Values.ingress.hil.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.hil.className }}
  rules:
    - host: {{ .Values.ingress.hil.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hil-agent
                port:
                  number: 8080
{{- end }}
