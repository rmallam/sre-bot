{{- $ns := include "sre-bot.namespace" . }}
{{- $secret := include "sre-bot.secretName" . }}
{{- if and (eq .Values.runStore.backend "redis") (not .Values.redis.enabled) }}
{{- fail "runStore.backend=redis requires redis.enabled=true" }}
{{- end }}

{{- if .Values.agents.watcher.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: watcher-agent
  namespace: {{ $ns }}
  labels:
    {{- include "sre-bot.labels" . | nindent 4 }}
    sre-bot/agent: watcher
spec:
  replicas: {{ .Values.agents.watcher.replicas }}
  selector:
    matchLabels:
      app: watcher-agent
  template:
    metadata:
      labels:
        app: watcher-agent
        sre-bot/agent: watcher
    spec:
      serviceAccountName: watcher-agent
      {{- include "sre-bot.imagePullSecrets" . }}
      containers:
        - name: watcher
          image: {{ include "sre-bot.image" (dict "root" . "agent" "watcher") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: INVESTIGATOR_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "investigator" "root" .) | quote }}
            - name: ORCHESTRATOR_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "orchestrator" "root" .) | quote }}
            - name: USE_ORCHESTRATOR
              value: {{ .Values.watcher.useOrchestrator | quote }}
            - name: COOLDOWN_MINUTES
              value: {{ .Values.watcher.cooldownMinutes | quote }}
            - name: WATCH_NAMESPACES
              value: {{ .Values.watcher.watchNamespaces | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.agents.watcher.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: watcher-agent
  namespace: {{ $ns }}
spec:
  selector:
    app: watcher-agent
  ports:
    - port: 8080
      targetPort: http
{{- end }}

