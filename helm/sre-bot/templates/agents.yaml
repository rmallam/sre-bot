{{- if .Values.agents.gitops.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-agent
  namespace: {{ $ns }}
spec:
  replicas: {{ .Values.agents.gitops.replicas }}
  selector:
    matchLabels:
      app: gitops-agent
  template:
    metadata:
      labels:
        app: gitops-agent
    spec:
      serviceAccountName: gitops-agent
      {{- include "sre-bot.imagePullSecrets" . }}
      containers:
        - name: gitops
          image: {{ include "sre-bot.image" (dict "root" . "agent" "gitops") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: COMMANDER_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "commander" "root" .) | quote }}
            - name: HIL_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "hil" "root" .) | quote }}
            - name: GITOPS_REPO_PATH
              value: {{ .Values.gitops.repoPath | quote }}
            - name: GITOPS_USE_PR
              value: {{ .Values.gitops.usePr | quote }}
            - name: DEPLOY_PUSH_APP_REPO
              value: {{ .Values.gitops.deployPushAppRepo | quote }}
            - name: DEPLOY_PUSH_GITOPS
              value: {{ .Values.gitops.deployPushGitops | quote }}
            - name: GITOPS_REPO_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: gitops_repo_url
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: github_token
                  optional: true
            - name: ARGOCD_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: argocd_url
                  optional: true
            - name: ARGOCD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: argocd_token
                  optional: true
          {{- if or .Values.secrets.gitSshPrivateKey .Values.gitops.persistence.enabled }}
          volumeMounts:
            {{- if .Values.secrets.gitSshPrivateKey }}
            - name: git-credentials
              mountPath: /root/.ssh
              readOnly: true
            {{- end }}
            {{- if .Values.gitops.persistence.enabled }}
            - name: gitops-mirror
              mountPath: {{ .Values.gitops.repoPath }}
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.agents.gitops.resources | nindent 12 }}
      volumes:
        {{- if .Values.secrets.gitSshPrivateKey }}
        - name: git-credentials
          secret:
            secretName: sre-bot-git-ssh
            defaultMode: 0400
        {{- end }}
        {{- if .Values.gitops.persistence.enabled }}
        - name: gitops-mirror
          persistentVolumeClaim:
            claimName: gitops-mirror-pvc
        {{- else }}
        - name: gitops-mirror
          emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: gitops-agent
  namespace: {{ $ns }}
spec:
  selector:
    app: gitops-agent
  ports:
    - port: 8080
      targetPort: http
{{- end }}
