                secretKeyRef:
                  name: {{ $secret }}
                  key: telegram_alert_chat_id
                  optional: true
          volumeMounts:
            - name: hil-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.agents.hil.resources | nindent 12 }}
      volumes:
        - name: hil-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hil-agent
  namespace: {{ $ns }}
spec:
  type: {{ .Values.service.hil.type }}
  selector:
    app: hil-agent
  ports:
    - port: {{ .Values.service.hil.port }}
      targetPort: http
{{- end }}

{{- if .Values.agents.gitops.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-agent
  namespace: {{ $ns }}
spec:
  replicas: {{ .Values.agents.gitops.replicas }}
  selector:
    matchLabels:
      app: gitops-agent
  template:
    metadata:
      labels:
        app: gitops-agent
    spec:
      serviceAccountName: gitops-agent
      {{- include "sre-bot.imagePullSecrets" . }}
      containers:
        - name: gitops
          image: {{ include "sre-bot.image" (dict "root" . "agent" "gitops") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            {{- include "sre-bot.internalAuthEnv" . | nindent 12 }}
            - name: COMMANDER_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "commander" "root" .) | quote }}
            - name: HIL_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "hil" "root" .) | quote }}
            - name: GITOPS_REPO_PATH
              value: {{ .Values.gitops.repoPath | quote }}
            - name: GITOPS_USE_PR
              value: {{ .Values.gitops.usePr | quote }}
            - name: DEPLOY_PUSH_APP_REPO
              value: {{ .Values.gitops.deployPushAppRepo | quote }}
            - name: DEPLOY_PUSH_GITOPS
              value: {{ .Values.gitops.deployPushGitops | quote }}
            - name: GITOPS_PATCH_MODE
              value: {{ .Values.gitops.patchMode | quote }}
            - name: DIRECT_DEPLOY_DRY_RUN
              value: {{ .Values.gitops.directDeployDryRun | quote }}
            - name: GITOPS_REPO_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: gitops_repo_url
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: github_token
                  optional: true
            - name: ARGOCD_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: argocd_url
                  optional: true
            - name: ARGOCD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: argocd_token
                  optional: true
          {{- if or .Values.secrets.gitSshPrivateKey .Values.gitops.persistence.enabled }}
          volumeMounts:
            {{- if .Values.secrets.gitSshPrivateKey }}
            - name: git-credentials
              mountPath: /root/.ssh
              readOnly: true
            {{- end }}
            {{- if .Values.gitops.persistence.enabled }}
            - name: gitops-mirror
              mountPath: {{ .Values.gitops.repoPath }}
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.agents.gitops.resources | nindent 12 }}
      volumes:
        {{- if .Values.secrets.gitSshPrivateKey }}
        - name: git-credentials
          secret:
            secretName: sre-bot-git-ssh
            defaultMode: 0400
        {{- end }}
        {{- if .Values.gitops.persistence.enabled }}
        - name: gitops-mirror
          persistentVolumeClaim:
            claimName: gitops-mirror-pvc
        {{- else }}
        - name: gitops-mirror
          emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: gitops-agent
  namespace: {{ $ns }}
spec:
  selector:
    app: gitops-agent
  ports:
    - port: 8080
      targetPort: http
{{- end }}

{{- if .Values.agents.debugMcp.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: debug-mcp-agent
  namespace: {{ $ns }}
  annotations:
    sre.bot/app-id: debug-mcp
    sre.bot/human-only: "true"
spec:
  replicas: {{ .Values.agents.debugMcp.replicas }}
  selector:
    matchLabels:
      app: debug-mcp-agent
  template:
    metadata:
      labels:
        app: debug-mcp-agent
        sre-bot/agent: debug-mcp
    spec:
      serviceAccountName: debug-mcp-agent
      {{- include "sre-bot.imagePullSecrets" . }}
      containers:
        - name: debug-mcp
          image: {{ include "sre-bot.image" (dict "root" . "agent" "debug-mcp") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DEBUG_MCP_ENABLED
              value: {{ .Values.debugMcp.enabled | quote }}
            - name: DEBUG_MCP_MAX_LOG_BYTES
              value: {{ .Values.debugMcp.maxLogBytes | quote }}
            {{- if .Values.debugMcp.token }}
            - name: DEBUG_MCP_TOKEN
              value: {{ .Values.debugMcp.token | quote }}
            {{- end }}
            {{- if .Values.debugMcp.lokiUrl }}
            - name: LOKI_URL
              value: {{ .Values.debugMcp.lokiUrl | quote }}
            {{- else if .Values.investigator.lokiUrl }}
            - name: LOKI_URL
              value: {{ .Values.investigator.lokiUrl | quote }}
            {{- end }}
            {{- if .Values.debugMcp.prometheusUrl }}
            - name: PROMETHEUS_URL
              value: {{ .Values.debugMcp.prometheusUrl | quote }}
            {{- else if .Values.investigator.prometheusUrl }}
            - name: PROMETHEUS_URL
              value: {{ .Values.investigator.prometheusUrl | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.agents.debugMcp.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: debug-mcp-agent
  namespace: {{ $ns }}
spec:
  selector:
    app: debug-mcp-agent
  ports:
    - port: 8080
      targetPort: http
{{- end }}
