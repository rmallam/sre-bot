{{- $ns := include "sre-bot.namespace" . }}
{{- $secret := include "sre-bot.secretName" . }}
{{- if and (eq .Values.runStore.backend "redis") (not .Values.redis.enabled) }}
{{- fail "runStore.backend=redis requires redis.enabled=true" }}
{{- end }}

{{- if .Values.agents.watcher.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: watcher-agent
  namespace: {{ $ns }}
  labels:
    {{- include "sre-bot.labels" . | nindent 4 }}
    sre-bot/agent: watcher
spec:
  replicas: {{ .Values.agents.watcher.replicas }}
  selector:
    matchLabels:
      app: watcher-agent
  template:
    metadata:
      labels:
        app: watcher-agent
        sre-bot/agent: watcher
    spec:
      serviceAccountName: watcher-agent
      {{- include "sre-bot.imagePullSecrets" . }}
      containers:
        - name: watcher
          image: {{ include "sre-bot.image" (dict "root" . "agent" "watcher") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: INVESTIGATOR_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "investigator" "root" .) | quote }}
            - name: ORCHESTRATOR_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "orchestrator" "root" .) | quote }}
            - name: USE_ORCHESTRATOR
              value: {{ .Values.watcher.useOrchestrator | quote }}
            - name: HIL_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "hil" "root" .) | quote }}
            - name: COOLDOWN_MINUTES
              value: {{ .Values.watcher.cooldownMinutes | quote }}
            - name: WATCH_NAMESPACES
              value: {{ .Values.watcher.watchNamespaces | quote }}
            - name: HEALTH_CHECK_ENABLED
              value: {{ .Values.watcher.healthCheckEnabled | quote }}
            - name: HEALTH_CHECK_INTERVAL_MS
              value: {{ .Values.watcher.healthCheckIntervalMs | quote }}
            - name: HEALTH_CHECK_COOLDOWN_MS
              value: {{ .Values.watcher.healthCheckCooldownMs | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.agents.watcher.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: watcher-agent
  namespace: {{ $ns }}
spec:
  selector:
    app: watcher-agent
  ports:
    - port: 8080
      targetPort: http
{{- end }}

{{- if .Values.agents.commander.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commander-agent
  namespace: {{ $ns }}
  annotations:
    sre.bot/app-id: commander
    sre.bot/depends-on: orchestrator-agent,investigator-agent,redis-agent
spec:
  replicas: {{ .Values.agents.commander.replicas }}
  selector:
    matchLabels:
      app: commander-agent
  template:
    metadata:
      labels:
        app: commander-agent
    spec:
      serviceAccountName: commander-agent
      {{- include "sre-bot.imagePullSecrets" . }}
      containers:
        - name: commander
          image: {{ include "sre-bot.image" (dict "root" . "agent" "commander") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: ORCHESTRATOR_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "orchestrator" "root" .) | quote }}
            - name: INVESTIGATOR_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "investigator" "root" .) | quote }}
            - name: SECURITY_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "security" "root" .) | quote }}
            - name: USE_ORCHESTRATOR
              value: {{ .Values.commander.useOrchestrator | quote }}
            - name: HIL_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "hil" "root" .) | quote }}
            - name: GITOPS_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "gitops" "root" .) | quote }}
            - name: CONVERSATIONAL_NARRATE
              value: {{ .Values.commander.conversationalNarrate | quote }}
            - name: CONVERSATIONAL_NARRATE_LLM
              value: {{ .Values.commander.conversationalNarrateLlm | quote }}
            - name: SRE_AGENT_MODE
              value: {{ .Values.agentMode.sreAgentMode | quote }}
            {{- if .Values.agentMode.commanderRoutingMode }}
            - name: COMMANDER_ROUTING_MODE
              value: {{ .Values.agentMode.commanderRoutingMode | quote }}
            {{- end }}
            {{- include "sre-bot.redisSessionEnv" . | nindent 12 }}
            {{- include "sre-bot.platformEnv" . | nindent 12 }}
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: github_webhook_secret
                  optional: true
            - name: GITHUB_WEBHOOK_NOTIFY_PLATFORM
              value: {{ .Values.commander.githubWebhookNotifyPlatform | quote }}
            - name: GITHUB_WEBHOOK_NOTIFY_CHANNEL_ID
              value: {{ .Values.commander.githubWebhookNotifyChannelId | quote }}
            - name: ALERTMANAGER_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: alertmanager_webhook_secret
                  optional: true
            - name: ALERTMANAGER_NOTIFY_PLATFORM
              value: {{ .Values.commander.alertmanagerNotifyPlatform | quote }}
            - name: ALERTMANAGER_NOTIFY_CHANNEL_ID
              value: {{ .Values.commander.alertmanagerNotifyChannelId | quote }}
            - name: ALERTMANAGER_COOLDOWN_MS
              value: {{ .Values.commander.alertmanagerCooldownMs | quote }}
            - name: ALERT_CORRELATION_ENABLED
              value: {{ .Values.commander.alertCorrelationEnabled | quote }}
            - name: ALERT_CORRELATION_USE_APP_GRAPH
              value: {{ .Values.commander.alertCorrelationUseAppGraph | quote }}
            - name: ALERT_CORRELATION_WINDOW_MS
              value: {{ .Values.commander.alertCorrelationWindowMs | quote }}
            - name: ALERT_CORRELATION_MIN_GROUP
              value: {{ .Values.commander.alertCorrelationMinGroup | quote }}
            - name: ALLOWED_USERS
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: allowed_users
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: openrouter_api_key
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: gemini_api_key
                  optional: true
            {{- include "sre-bot.llmEnv" . | nindent 12 }}
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: slack_bot_token
                  optional: true
            - name: SLACK_APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: slack_app_token
                  optional: true
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: telegram_bot_token
                  optional: true
            - name: TELEGRAM_ALERT_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: telegram_alert_chat_id
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.agents.commander.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: commander-agent
  namespace: {{ $ns }}
spec:
  type: {{ .Values.service.commander.type }}
  selector:
    app: commander-agent
  ports:
    - port: {{ .Values.service.commander.port }}
      targetPort: http
{{- end }}

{{- if .Values.agents.investigator.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: investigator-agent
  namespace: {{ $ns }}
  annotations:
    sre.bot/app-id: investigator
    sre.bot/depends-on: brain-agent,orchestrator-agent
spec:
  replicas: {{ .Values.agents.investigator.replicas }}
  selector:
    matchLabels:
      app: investigator-agent
  template:
    metadata:
      labels:
        app: investigator-agent
    spec:
      serviceAccountName: investigator-agent
      {{- include "sre-bot.imagePullSecrets" . }}
      containers:
        - name: investigator
          image: {{ include "sre-bot.image" (dict "root" . "agent" "investigator") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: BRAIN_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "brain" "root" .) | quote }}
            - name: ORCHESTRATOR_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "orchestrator" "root" .) | quote }}
            - name: USE_ORCHESTRATOR
              value: "true"
            - name: INVESTIGATOR_SAFE_MODE
              value: {{ .Values.investigator.safeMode | quote }}
            - name: GIT_SYNC_INTERVAL_SECONDS
              value: {{ .Values.investigator.gitSyncIntervalSeconds | quote }}
            - name: DEEP_RCA_ENABLED
              value: {{ .Values.investigator.deepRcaEnabled | quote }}
            {{- if .Values.investigator.lokiUrl }}
            - name: LOKI_URL
              value: {{ .Values.investigator.lokiUrl | quote }}
            {{- end }}
            {{- if .Values.investigator.prometheusUrl }}
            - name: PROMETHEUS_URL
              value: {{ .Values.investigator.prometheusUrl | quote }}
            {{- end }}
            {{- if .Values.investigator.playbookVerifyUrlAllowlist }}
            - name: PLAYBOOK_VERIFY_URL_ALLOWLIST
              value: {{ .Values.investigator.playbookVerifyUrlAllowlist | quote }}
            {{- end }}
            {{- include "sre-bot.agentModeEnv" . | nindent 12 }}
            - name: GITOPS_REPO_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: gitops_repo_url
          {{- if .Values.secrets.gitSshPrivateKey }}
          volumeMounts:
            - name: git-credentials
              mountPath: /root/.ssh
              readOnly: true
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.agents.investigator.resources | nindent 12 }}
      {{- if .Values.secrets.gitSshPrivateKey }}
      volumes:
        - name: git-credentials
          secret:
            secretName: sre-bot-git-ssh
            defaultMode: 0400
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: investigator-agent
  namespace: {{ $ns }}
spec:
  selector:
    app: investigator-agent
  ports:
    - port: 8080
      targetPort: http
{{- end }}

