{{- if .Values.agents.orchestrator.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-agent
  namespace: {{ $ns }}
  annotations:
    sre.bot/app-id: orchestrator
    sre.bot/depends-on: investigator-agent,brain-agent,hil-agent,gitops-agent
spec:
  replicas: {{ .Values.agents.orchestrator.replicas }}
  selector:
    matchLabels:
      app: orchestrator-agent
  template:
    metadata:
      labels:
        app: orchestrator-agent
    spec:
      serviceAccountName: orchestrator-agent
      {{- include "sre-bot.imagePullSecrets" . }}
      containers:
        - name: orchestrator
          image: {{ include "sre-bot.image" (dict "root" . "agent" "orchestrator") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            {{- include "sre-bot.internalAuthEnv" . | nindent 12 }}
            - name: INVESTIGATOR_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "investigator" "root" .) | quote }}
            {{- if .Values.agents.cicd.enabled }}
            - name: CICD_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "cicd" "root" .) | quote }}
            {{- end }}
            {{- if .Values.agents.coding.enabled }}
            - name: CODING_AGENT_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "coding" "root" .) | quote }}
            {{- end }}
            - name: SECURITY_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "security" "root" .) | quote }}
            - name: BRAIN_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "brain" "root" .) | quote }}
            - name: EXECUTOR_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "executor" "root" .) | quote }}
            - name: GITOPS_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "gitops" "root" .) | quote }}
            - name: HIL_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "hil" "root" .) | quote }}
            - name: COMMANDER_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "commander" "root" .) | quote }}
            - name: CONVERSATIONAL_NARRATE
              value: {{ .Values.commander.conversationalNarrate | quote }}
            {{- include "sre-bot.agentModeEnv" . | nindent 12 }}
            {{- include "sre-bot.platformEnv" . | nindent 12 }}
            - name: SRE_RAG_GROUNDING
              value: {{ .Values.agentMode.ragGrounding | quote }}
            - name: SRE_RAG_LEARNING
              value: {{ .Values.agentMode.ragLearning | quote }}
            - name: SRE_RAG_BYPASS_REACT
              value: {{ .Values.agentMode.ragBypassReact | quote }}
            - name: SRE_RAG_BYPASS_THRESHOLD
              value: {{ .Values.agentMode.ragBypassThreshold | quote }}
            - name: AUTONOMY_MODE
              value: {{ .Values.orchestrator.autonomyMode | quote }}
            - name: AUTONOMY_MAX_ITERATIONS
              value: {{ .Values.orchestrator.maxIterations | quote }}
            {{- if .Values.orchestrator.namespaceRunLimit }}
            - name: NAMESPACE_RUN_LIMIT
              value: {{ .Values.orchestrator.namespaceRunLimit | quote }}
            {{- end }}
            - name: NAMESPACE_QUEUE_DRAIN_MS
              value: {{ .Values.orchestrator.namespaceQueueDrainMs | quote }}
            - name: AUTO_GIT_ROLLBACK_ENABLED
              value: {{ .Values.orchestrator.autoGitRollbackEnabled | quote }}
            - name: AUTO_GIT_ROLLBACK_REQUIRE_HIL
              value: {{ .Values.orchestrator.autoGitRollbackRequireHil | quote }}
            - name: AUTO_GIT_ROLLBACK_BLOCK_NAMESPACES
              value: {{ .Values.orchestrator.autoGitRollbackBlockNamespaces | quote }}
            - name: FAILURE_ANALYSIS_ENABLED
              value: {{ .Values.orchestrator.failureAnalysisEnabled | quote }}
            - name: CI_CODE_FIX_ENABLED
              value: {{ .Values.orchestrator.ciCodeFixEnabled | quote }}
            - name: CI_CLASSIFY_LLM
              value: {{ .Values.orchestrator.ciClassifyLlm | quote }}
            - name: CODING_AGENT_ENABLED
              value: {{ .Values.orchestrator.codingAgentEnabled | quote }}
            - name: CODING_AGENT_MAX_ITERATIONS
              value: {{ .Values.orchestrator.codingAgentMaxIterations | quote }}
            - name: RUN_STORE_BACKEND
              value: {{ .Values.runStore.backend | quote }}
            {{- if .Values.orchestrator.useCapabilityPlanner }}
            - name: USE_CAPABILITY_PLANNER
              value: {{ .Values.orchestrator.useCapabilityPlanner | quote }}
            {{- end }}
            - name: PER_TOOL_HIL
              value: {{ .Values.orchestrator.perToolHil | quote }}
            - name: REGISTRY_DRY_RUN
              value: {{ .Values.orchestrator.registryDryRun | quote }}
            {{- if eq .Values.runStore.backend "postgres" }}
            - name: DATABASE_URL
              value: {{ include "sre-bot.databaseUrl" . | quote }}
            {{- else if eq .Values.runStore.backend "redis" }}
            - name: REDIS_URL
              value: {{ include "sre-bot.redisUrl" . | quote }}
            {{- else }}
            - name: RUN_STORE_PATH
              value: "/data/runs"
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- if eq .Values.runStore.backend "file" }}
          volumeMounts:
            - name: run-data
              mountPath: /data/runs
          {{- end }}
          resources:
            {{- toYaml .Values.agents.orchestrator.resources | nindent 12 }}
      {{- if eq .Values.runStore.backend "file" }}
      volumes:
        - name: run-data
          emptyDir: {}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-agent
  namespace: {{ $ns }}
spec:
  type: {{ .Values.service.orchestrator.type }}
  selector:
    app: orchestrator-agent
  ports:
    - port: {{ .Values.service.orchestrator.port }}
      targetPort: http
{{- end }}

