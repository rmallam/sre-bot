{{- if .Values.agents.orchestrator.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-agent
  namespace: {{ $ns }}
spec:
  replicas: {{ .Values.agents.orchestrator.replicas }}
  selector:
    matchLabels:
      app: orchestrator-agent
  template:
    metadata:
      labels:
        app: orchestrator-agent
    spec:
      serviceAccountName: orchestrator-agent
      {{- include "sre-bot.imagePullSecrets" . }}
      containers:
        - name: orchestrator
          image: {{ include "sre-bot.image" (dict "root" . "agent" "orchestrator") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: INVESTIGATOR_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "investigator" "root" .) | quote }}
            - name: SECURITY_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "security" "root" .) | quote }}
            - name: BRAIN_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "brain" "root" .) | quote }}
            - name: EXECUTOR_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "executor" "root" .) | quote }}
            - name: GITOPS_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "gitops" "root" .) | quote }}
            - name: HIL_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "hil" "root" .) | quote }}
            - name: COMMANDER_URL
              value: {{ include "sre-bot.serviceUrl" (dict "agent" "commander" "root" .) | quote }}
            - name: AUTONOMY_MODE
              value: {{ .Values.orchestrator.autonomyMode | quote }}
            - name: AUTONOMY_MAX_ITERATIONS
              value: {{ .Values.orchestrator.maxIterations | quote }}
            - name: RUN_STORE_BACKEND
              value: {{ .Values.runStore.backend | quote }}
            - name: USE_CAPABILITY_PLANNER
              value: {{ .Values.orchestrator.useCapabilityPlanner | quote }}
            - name: PER_TOOL_HIL
              value: {{ .Values.orchestrator.perToolHil | quote }}
            - name: REGISTRY_DRY_RUN
              value: {{ .Values.orchestrator.registryDryRun | quote }}
            {{- if eq .Values.runStore.backend "postgres" }}
            - name: DATABASE_URL
              value: {{ include "sre-bot.databaseUrl" . | quote }}
            {{- else if eq .Values.runStore.backend "redis" }}
            - name: REDIS_URL
              value: {{ include "sre-bot.redisUrl" . | quote }}
            {{- else }}
            - name: RUN_STORE_PATH
              value: "/data/runs"
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- if eq .Values.runStore.backend "file" }}
          volumeMounts:
            - name: run-data
              mountPath: /data/runs
          {{- end }}
          resources:
            {{- toYaml .Values.agents.orchestrator.resources | nindent 12 }}
      {{- if eq .Values.runStore.backend "file" }}
      volumes:
        - name: run-data
          emptyDir: {}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-agent
  namespace: {{ $ns }}
spec:
  type: {{ .Values.service.orchestrator.type }}
  selector:
    app: orchestrator-agent
  ports:
    - port: {{ .Values.service.orchestrator.port }}
      targetPort: http
{{- end }}

