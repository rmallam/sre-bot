name: sre-bot

# Podman: after failed/partial runs, always: `podman compose down --remove-orphans` before up.
# Use ./scripts/compose-up.sh for a clean start.

# HTTP health probe (Node 22 image — no curl required)
x-agent-healthcheck: &agent-healthcheck
  test:
    [
      "CMD",
      "node",
      "-e",
      "fetch('http://127.0.0.1:8080/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
    ]
  interval: 5s
  timeout: 5s
  retries: 12
  start_period: 60s

networks:
  sre-net:
    driver: bridge

volumes:
  gitops-mirror:
  run-data:
  postgres-data:
  rag-postgres-data:
  hil-data:

services:
  postgres:
    image: postgres:16-alpine
    networks: [sre-net]
    environment:
      POSTGRES_USER: sre
      POSTGRES_PASSWORD: sre
      POSTGRES_DB: sre_runs
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sre -d sre_runs']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    networks: [sre-net]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  rag-postgres:
    image: pgvector/pgvector:pg16
    networks: [sre-net]
    environment:
      POSTGRES_USER: sre
      POSTGRES_PASSWORD: sre
      POSTGRES_DB: sre_rag
    volumes:
      - rag-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sre -d sre_rag']
      interval: 5s
      timeout: 5s
      retries: 8

  platform-agent:
    container_name: sre-bot-platform
    build:
      context: .
      dockerfile: sre-agent-platform/Dockerfile
    env_file:
      - .env.local
    networks: [sre-net]
    depends_on:
      rag-postgres:
        condition: service_healthy
    ports:
      - "8090:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    environment:
      - SRE_RAG_DATABASE_URL=postgresql://sre:sre@rag-postgres:5432/sre_rag
      - SRE_RAG_ENABLED=true
      - SRE_RAG_AUTO_MIGRATE=true
      - SRE_RAG_LEARNING=${SRE_RAG_LEARNING:-true}
      - SRE_ROUTER_ENCODER=openai
      - SRE_EMBEDDING_PROVIDER=openai
      - SRE_ROUTER_SCORE_THRESHOLD=${SRE_ROUTER_SCORE_THRESHOLD:-0.70}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}

  # Optional: in-compose kubectl proxy. Default stack uses host.containers.internal instead
  # (Podman Desktop API e.g. https://127.0.0.1:50750 on the Mac).
  # Enable with: podman compose --profile kube-proxy up
  kube-proxy:
    profiles: ["kube-proxy"]
    container_name: sre-bot-kube-proxy
    image: docker.io/bitnami/kubectl:1.31
    networks: [sre-net]
    restart: unless-stopped
    volumes:
      - ${HOME}/.kube:/root/.kube:ro
    command:
      - kubectl
      - proxy
      - --address=0.0.0.0
      - --port=8001
      - --accept-hosts=.*
      - --accept-paths=.*
    # Must hit the proxy process, not the API server directly.
    healthcheck:
      test:
        [
          'CMD',
          'kubectl',
          '--server=http://127.0.0.1:8001',
          'get',
          '--raw',
          '/healthz',
        ]
      interval: 5s
      timeout: 10s
      retries: 18
      start_period: 15s

  watcher-agent:
    build:
      context: .
      dockerfile: agents/watcher/Dockerfile
    networks: [sre-net]
    entrypoint: ["/app/scripts/container-entrypoint.sh"]
    environment:
      - AGENT_DIR=watcher
      - KUBE_API_HOST=host.containers.internal
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - PORT=8080
      - INVESTIGATOR_URL=http://investigator-agent:8080
      - ORCHESTRATOR_URL=http://orchestrator-agent:8080
      - USE_ORCHESTRATOR=true
      - HIL_URL=http://hil-agent:8080
      - COOLDOWN_MINUTES=2
      - WATCH_NAMESPACES=${WATCH_NAMESPACES:-}
      - KUBECONFIG=/tmp/kube/config
    volumes:
      - ~/.kube:/root/.kube:ro

  commander-agent:
    build:
      context: .
      dockerfile: agents/commander/Dockerfile
    networks: [sre-net]
    ports:
      - "8081:8080"
    depends_on:
      - investigator-agent
      - security-agent
      - gitops-agent
      - redis
      - platform-agent
    healthcheck: *agent-healthcheck
    environment:
      - PORT=8080
      - ORCHESTRATOR_URL=http://orchestrator-agent:8080
      - INVESTIGATOR_URL=http://investigator-agent:8080
      - GITOPS_URL=http://gitops-agent:8080
      - SECURITY_URL=http://security-agent:8080
      - USE_ORCHESTRATOR=true
      - ALLOWED_USERS=${ALLOWED_USERS}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_COMMANDER_MODEL=${OPENROUTER_COMMANDER_MODEL:-google/gemini-2.5-flash}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_COMMANDER_MODEL=${GEMINI_COMMANDER_MODEL:-gemini-2.5-flash}
      - HIL_URL=http://hil-agent:8080
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - GITHUB_WEBHOOK_NOTIFY_PLATFORM=${GITHUB_WEBHOOK_NOTIFY_PLATFORM:-telegram}
      - GITHUB_WEBHOOK_NOTIFY_CHANNEL_ID=${GITHUB_WEBHOOK_NOTIFY_CHANNEL_ID:-}
      - TELEGRAM_ALERT_CHAT_ID=${TELEGRAM_ALERT_CHAT_ID:-}
      - CONVERSATIONAL_NARRATE=${CONVERSATIONAL_NARRATE:-true}
      - CONVERSATIONAL_NARRATE_LLM=${CONVERSATIONAL_NARRATE_LLM:-true}
      - REDIS_URL=redis://redis:6379
      - CHAT_SESSION_BACKEND=${CHAT_SESSION_BACKEND:-redis}
      - CHAT_SESSION_TTL_SECONDS=${CHAT_SESSION_TTL_SECONDS:-604800}
      - SRE_AGENT_MODE=${SRE_AGENT_MODE:-classic}
      - COMMANDER_ROUTING_MODE=${COMMANDER_ROUTING_MODE:-}
      - CASE_STORE_BACKEND=${CASE_STORE_BACKEND:-redis}
      - CASE_TTL_SECONDS=${CASE_TTL_SECONDS:-604800}
      - SRE_PLATFORM_URL=http://platform-agent:8080
      - SRE_PLATFORM_ROUTING=${SRE_PLATFORM_ROUTING:-true}

  investigator-agent:
    container_name: sre-bot-investigator
    build:
      context: .
      dockerfile: agents/investigator/Dockerfile
    networks: [sre-net]
    healthcheck: *agent-healthcheck
    entrypoint: ["/app/scripts/container-entrypoint.sh"]
    ports:
      - "8082:8080"
    environment:
      - AGENT_DIR=investigator
      - KUBE_API_HOST=host.containers.internal
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - PORT=8080
      - BRAIN_URL=http://brain-agent:8080
      - ORCHESTRATOR_URL=http://orchestrator-agent:8080
      - USE_ORCHESTRATOR=true
      - GITOPS_REPO_URL=${GITOPS_REPO_URL}
      - INVESTIGATOR_SAFE_MODE=true
      - GIT_SYNC_INTERVAL_SECONDS=60
      - LOKI_URL=${LOKI_URL:-}
      - PROMETHEUS_URL=${PROMETHEUS_URL:-}
      - DEEP_RCA_ENABLED=${DEEP_RCA_ENABLED:-true}
      - KUBECONFIG=/tmp/kube/config
      - SRE_AGENT_MODE=${SRE_AGENT_MODE:-classic}
      - INVESTIGATE_GATHER_MODE=${INVESTIGATE_GATHER_MODE:-}
    volumes:
      - ~/.kube:/root/.kube:ro
      - ~/.ssh:/root/.ssh:ro

  brain-agent:
    build:
      context: .
      dockerfile: agents/brain/Dockerfile
    networks: [sre-net]
    entrypoint: ["/app/scripts/container-entrypoint.sh"]
    ports:
      - "8083:8080"
    environment:
      - AGENT_DIR=brain
      - KUBE_API_HOST=host.containers.internal
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - PORT=8080
      - HIL_URL=http://hil-agent:8080
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BRAIN_MODEL=${OPENROUTER_BRAIN_MODEL:-anthropic/claude-sonnet-4}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_BRAIN_MODEL=${GEMINI_BRAIN_MODEL:-gemini-2.5-pro}
      - CIRCUIT_BREAKER_LIMIT=3
      - CICD_SKILLS_DIR=/data/skills
      - KUBECONFIG=/tmp/kube/config
      - SRE_AGENT_MODE=${SRE_AGENT_MODE:-classic}
      - AGENTIC_LLM_TOOL_SELECT=${AGENTIC_LLM_TOOL_SELECT:-}
      - AGENTIC_LLM_REFLECT=${AGENTIC_LLM_REFLECT:-}
      - SKILLS_DIR=/data/skills
    volumes:
      - ~/.kube:/root/.kube:ro
      - ./skills:/data/skills:ro

  orchestrator-agent:
    build:
      context: .
      dockerfile: agents/orchestrator/Dockerfile
    networks: [sre-net]
    ports:
      - "8084:8080"
    depends_on:
      - postgres
      - investigator-agent
      - security-agent
      - cicd-agent
      - coding-agent
      - platform-agent
    healthcheck: *agent-healthcheck
    environment:
      - PORT=8080
      - INVESTIGATOR_URL=http://investigator-agent:8080
      - CICD_URL=http://cicd-agent:8080
      - CODING_AGENT_URL=http://coding-agent:8080
      - SECURITY_URL=http://security-agent:8080
      - BRAIN_URL=http://brain-agent:8080
      - EXECUTOR_URL=http://executor-agent:8080
      - GITOPS_URL=http://gitops-agent:8080
      - HIL_URL=http://hil-agent:8080
      - COMMANDER_URL=http://commander-agent:8080
      - AUTONOMY_MODE=low_risk_only
      - AUTONOMY_MAX_ITERATIONS=5
      - DATABASE_URL=postgresql://sre:sre@postgres:5432/sre_runs
      - RUN_STORE_BACKEND=postgres
      - USE_CAPABILITY_PLANNER=${USE_CAPABILITY_PLANNER:-}
      - PER_TOOL_HIL=false
      - FAILURE_ANALYSIS_ENABLED=${FAILURE_ANALYSIS_ENABLED:-true}
      - CI_CODE_FIX_ENABLED=${CI_CODE_FIX_ENABLED:-true}
      - CI_CLASSIFY_LLM=${CI_CLASSIFY_LLM:-true}
      - CODING_AGENT_ENABLED=${CODING_AGENT_ENABLED:-true}
      - CODING_AGENT_MAX_ITERATIONS=${CODING_AGENT_MAX_ITERATIONS:-5}
      - CONVERSATIONAL_NARRATE=${CONVERSATIONAL_NARRATE:-true}
      - SRE_AGENT_MODE=${SRE_AGENT_MODE:-classic}
      - ORCHESTRATOR_GRAPH_MODE=${ORCHESTRATOR_GRAPH_MODE:-}
      - INVESTIGATE_GATHER_MODE=${INVESTIGATE_GATHER_MODE:-}
      - AGENTIC_MAX_TURNS=${AGENTIC_MAX_TURNS:-12}
      - AGENTIC_MAX_READ_TOOLS=${AGENTIC_MAX_READ_TOOLS:-20}
      - AGENTIC_LLM_TOOL_SELECT=${AGENTIC_LLM_TOOL_SELECT:-}
      - AGENTIC_LLM_REFLECT=${AGENTIC_LLM_REFLECT:-}
      - SRE_PLATFORM_URL=http://platform-agent:8080
      - SRE_RAG_GROUNDING=${SRE_RAG_GROUNDING:-true}
      - SRE_RAG_LEARNING=${SRE_RAG_LEARNING:-true}
    volumes:
      - run-data:/data/runs

  security-agent:
    build:
      context: .
      dockerfile: agents/security/Dockerfile
    networks: [sre-net]
    ports:
      - "8088:8080"
    healthcheck: *agent-healthcheck
    environment:
      - PORT=8080
      - SECURITY_BLOCK_ON_FINDINGS=true
      - SECURITY_MAX_LOG_BYTES=16384

  executor-agent:
    build:
      context: .
      dockerfile: agents/executor/Dockerfile
    networks: [sre-net]
    entrypoint: ["/app/scripts/container-entrypoint.sh"]
    ports:
      - "8087:8080"
    environment:
      - AGENT_DIR=executor
      - KUBE_API_HOST=host.containers.internal
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - PORT=8080
      - KUBECONFIG=/tmp/kube/config
    volumes:
      - ~/.kube:/root/.kube:ro

  hil-agent:
    build:
      context: .
      dockerfile: agents/hil/Dockerfile
    networks: [sre-net]
    ports:
      - "8085:8080"
    environment:
      - PORT=8080
      - GITOPS_URL=http://gitops-agent:8080
      - EXECUTOR_URL=http://executor-agent:8080
      - ORCHESTRATOR_URL=http://orchestrator-agent:8080
      - BRAIN_URL=http://brain-agent:8080
      - APPROVAL_TIMEOUT_MINUTES=60
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET}
      - SLACK_ALERT_CHANNEL=${SLACK_ALERT_CHANNEL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALERT_CHAT_ID=${TELEGRAM_ALERT_CHAT_ID:-}
      - ORCHESTRATOR_URL=http://orchestrator-agent:8080
      - COMMANDER_URL=http://commander-agent:8080
      - IGNORE_STORE_PATH=/data/ignored-resources.json
    volumes:
      - hil-data:/data

  console-agent:
    build:
      context: .
      dockerfile: agents/console/Dockerfile
    networks: [sre-net]
    ports:
      - "8091:8080"
    depends_on:
      - hil-agent
      - orchestrator-agent
      - commander-agent
    healthcheck: *agent-healthcheck
    environment:
      - PORT=8080
      - HIL_URL=http://hil-agent:8080
      - ORCHESTRATOR_URL=http://orchestrator-agent:8080
      - COMMANDER_URL=http://commander-agent:8080
      - INVESTIGATOR_URL=http://investigator-agent:8080
      - BRAIN_URL=http://brain-agent:8080
      - CICD_URL=http://cicd-agent:8080
      - CODING_AGENT_URL=http://coding-agent:8080

  gitops-agent:
    build:
      context: .
      dockerfile: agents/gitops/Dockerfile
    networks: [sre-net]
    entrypoint: ["/app/scripts/container-entrypoint.sh"]
    ports:
      - "8086:8080"
    environment:
      - AGENT_DIR=gitops
      - KUBE_API_HOST=host.containers.internal
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - PORT=8080
      - COMMANDER_URL=http://commander-agent:8080
      - HIL_URL=http://hil-agent:8080
      # Progress messages during deploy → Telegram
      - GITOPS_REPO_URL=${GITOPS_REPO_URL}
      - GITOPS_REPO_PATH=/data/gitops-mirror
      - DEPLOY_PUSH_APP_REPO=true
      - DEPLOY_PUSH_GITOPS=true
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITOPS_USE_PR=false
      # cluster = live kubectl patch only; gitops = mirror repo only; auto = cluster then mirror if GITOPS_REPO_URL set
      - GITOPS_PATCH_MODE=${GITOPS_PATCH_MODE:-cluster}
      - ARGOCD_URL=${ARGOCD_URL}
      - ARGOCD_TOKEN=${ARGOCD_TOKEN}
      - KUBECONFIG=/tmp/kube/config
      - DIRECT_DEPLOY_DRY_RUN=${DIRECT_DEPLOY_DRY_RUN:-false}
    volumes:
      - gitops-mirror:/data/gitops-mirror
      - ~/.kube:/root/.kube:ro
      - ~/.ssh:/root/.ssh:ro

  cicd-agent:
    container_name: sre-bot-cicd
    build:
      context: .
      dockerfile: agents/cicd-agent/Dockerfile
    networks: [sre-net]
    ports:
      - "8089:8080"
    healthcheck: *agent-healthcheck
    environment:
      - PORT=8080
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - DEPLOY_APP_REPO_WRITE_TOKEN=${DEPLOY_APP_REPO_WRITE_TOKEN:-}

  coding-agent:
    container_name: sre-bot-coding-agent
    build:
      context: .
      dockerfile: agents/coding-agent/Dockerfile
    networks: [sre-net]
    depends_on:
      - brain-agent
      - cicd-agent
      - commander-agent
    ports:
      - "8092:8080"
    healthcheck: *agent-healthcheck
    environment:
      - PORT=8080
      - BRAIN_URL=http://brain-agent:8080
      - CICD_URL=http://cicd-agent:8080
      - COMMANDER_URL=http://commander-agent:8080
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - DEPLOY_APP_REPO_WRITE_TOKEN=${DEPLOY_APP_REPO_WRITE_TOKEN:-}
      - CODING_AGENT_ENABLED=${CODING_AGENT_ENABLED:-true}
      - CODING_AGENT_MAX_ITERATIONS=${CODING_AGENT_MAX_ITERATIONS:-5}
      - CICD_SKILLS_DIR=/data/skills
    volumes:
      - ./skills:/data/skills:ro

  # v2: optional AI gateway (enable AI_GATEWAY_URL in orchestrator/brain)
  ai-gateway:
    image: nginx:alpine
    networks: [sre-net]
    profiles: ["v2"]
    ports:
      - "8090:80"
