# Environment variables for docker-compose / podman compose (copy to .env.local)

# Local Podman Desktop: API is on host 127.0.0.1:50750 — compose uses host.containers.internal (default).
# Optional in-compose proxy: podman compose --profile kube-proxy up
# KUBE_PROXY_URL=http://kube-proxy:8001
# KUBE_API_HOST=host.containers.internal

# LLM (OpenRouter multi-model — recommended)
LLM_PROVIDER=openrouter
# Local deploy: skip flaky helm --dry-run (default false in compose)
# DIRECT_DEPLOY_DRY_RUN=false

OPENROUTER_API_KEY=
OPENROUTER_BRAIN_MODEL=anthropic/claude-sonnet-4
OPENROUTER_COMMANDER_MODEL=google/gemini-2.5-flash
# Optional native Gemini fallback (LLM_PROVIDER=gemini or auto when OpenRouter unset)
GEMINI_API_KEY=
GEMINI_BRAIN_MODEL=gemini-2.5-pro
GEMINI_COMMANDER_MODEL=gemini-2.5-flash
GITOPS_REPO_URL=
# git_patch apply path: cluster (direct API), gitops (mirror/Argo only), auto (cluster then mirror)
GITOPS_PATCH_MODE=cluster
GITHUB_TOKEN=
GITHUB_WEBHOOK_SECRET=
GITHUB_WEBHOOK_NOTIFY_PLATFORM=telegram
GITHUB_WEBHOOK_NOTIFY_CHANNEL_ID=
LOKI_URL=
PROMETHEUS_URL=
DEEP_RCA_ENABLED=true
# Source-to-image deploy (DEPLOY-2) — plan-only until SOURCE_BUILD_ENABLED=true
SOURCE_BUILD_ENABLED=false
SOURCE_BUILD_STRATEGY=buildpacks
IMAGE_REGISTRY=ghcr.io/my-org
CICD_SKILLS_DIR=./skills
CONVERSATIONAL_NARRATE=true
CONVERSATIONAL_NARRATE_LLM=true
# Hybrid regex+LLM routing gate: off | balanced | strict
COMMANDER_HYBRID_GATE_MODE=balanced
CI_CLASSIFY_LLM=true
ALLOWED_USERS=
TELEGRAM_BOT_TOKEN=
TELEGRAM_ALERT_CHAT_ID=
SLACK_BOT_TOKEN=
SLACK_APP_TOKEN=
SLACK_SIGNING_SECRET=
SLACK_ALERT_CHANNEL=
ARGOCD_URL=
ARGOCD_TOKEN=

# Autonomy
AUTONOMY_MODE=low_risk_only
AUTONOMY_MAX_ITERATIONS=5
USE_ORCHESTRATOR=true

# Security
SECURITY_BLOCK_ON_FINDINGS=true
INVESTIGATOR_SAFE_MODE=true

# Deploy
DEPLOY_PUSH_APP_REPO=true
DEPLOY_PUSH_GITOPS=true

# Run store (orchestrator transcripts)
RUN_STORE_BACKEND=postgres
DATABASE_URL=postgresql://sre:sre@postgres:5432/sre_runs
REDIS_URL=redis://redis:6379
# Commander chat sessions: memory | redis (default redis when REDIS_URL set)
CHAT_SESSION_BACKEND=redis
CHAT_SESSION_TTL_SECONDS=604800
RUN_STORE_PATH=/data/runs
RUN_STORE_TTL_SECONDS=604800
USE_CAPABILITY_PLANNER=false
PER_TOOL_HIL=false
# LLM failure analyst after act failure (retry vs escalate; default true)
FAILURE_ANALYSIS_ENABLED=true

# v2 SIEM (optional)
SIEM_ENDPOINT=
