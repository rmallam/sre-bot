# Unit + platform tests on every push and PR.
# Kind E2E requires a live cluster — run locally via ./scripts/test-all.sh

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Validate runbook corpus
        run: npm run runbooks:validate

  platform:
    name: Platform pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sre-agent-platform/requirements.txt

      - name: Install platform deps
        run: |
          python -m pip install --upgrade pip
          pip install -r sre-agent-platform/requirements.txt
          pip install pytest

      - name: Run platform tests
        run: npm run test:platform
